minimumReleaseAge: 1440

# Effect's release candidates break between versions, but its packages depend on
# each other with caret ranges, so a fresh resolve can mix them. Hold every
# Effect package, direct or transitive, to the catalog's version.
overrides:
  "@effect/ai-openai-compat": "catalog:"
  "@effect/platform-node": "catalog:"
  "@effect/platform-node-shared": "catalog:"
  "@effect/sql-d1": "catalog:"
  "@effect/sql-sqlite-do": "catalog:"
  "@effect/sql-sqlite-node": "catalog:"
  "@effect/vitest": "catalog:"
  effect: "catalog:"

peerDependencyRules:
  allowedVersions:
    "capnp-es@0.0.16>typescript": "7"
    # Patched to support Vitest 5; see patchedDependencies.
    "@cloudflare/vitest-plugin@1.3.3>vitest": "5"

patchedDependencies:
  # A Worker's local `url` changes between `alchemy dev` runs, but the planner
  # handed downstream bindings the previous run's value whenever the Worker's
  # own bindings held Outputs, so studio-api kept a stale test identity
  # provider address. Backports the planner change from
  # https://github.com/alchemy-run/alchemy/pull/1379 (in its three copies:
  # src, lib and the bundled bin/exec.js).
  # Destroying a local stage also left its Durable Objects' storage in
  # .alchemy/local, keyed by worker name and class, so redeploying the same
  # worker brought the old objects back. The local Worker provider now
  # removes each namespace's storage when the worker is deleted (src and lib).
  # Remove when upgrading past beta.79.
  alchemy@2.0.0-beta.79: patches/alchemy@2.0.0-beta.79.patch
  # Vitest 5 support, ported to the published build from
  # https://github.com/cloudflare/workers-sdk/pull/15500: the runner always uses
  # workerd's new module registry and its V2 module fallback protocol, enables
  # `weak_ref` for Vitest 5's spies, and forwards coverage files to the host.
  # Remove when a release includes that pull request.
  "@cloudflare/vitest-plugin@1.3.3": patches/@cloudflare__vitest-plugin@1.3.3.patch
