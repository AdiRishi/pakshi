allowBuilds:
  "@scarf/scarf": false
  "@tailwindcss/oxide": true
  esbuild: true
  msgpackr-extract: false
  sharp: true
  workerd: true

minimumReleaseAge: 1440

# Effect's release candidates break between versions, but its packages depend on
# each other with caret ranges, so a fresh resolve can mix them. Hold every
# Effect package, direct or transitive, to the catalog's version.
overrides:
  "@effect/platform-node": "catalog:"
  "@effect/platform-node-shared": "catalog:"
  "@effect/sql-d1": "catalog:"
  "@effect/sql-sqlite-do": "catalog:"
  "@effect/sql-sqlite-node": "catalog:"
  "@effect/vitest": "catalog:"
  effect: "catalog:"

peerDependencyRules:
  allowedVersions:
    "capnp-es@0.0.16>typescript": "7"
