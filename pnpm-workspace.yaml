minimumReleaseAge: 1440
# Alchemy beta.80 and the packages released with it. Remove once they are a day
# old, after 2026-10-03 12:21 UTC.
minimumReleaseAgeExclude:
  - alchemy@2.0.0-beta.80
  - "@alchemy.run/cloudflare-runtime@2.0.0-beta.80"
  - "@alchemy.run/floci@2.0.0-beta.80"
  - "@alchemy.run/frontend-frameworks@2.0.0-beta.80"
  - "@alchemy.run/node-utils@2.0.0-beta.80"
  - "@distilled.cloud/acme@1.0.0-rc.13"
  - "@distilled.cloud/aws@1.0.0-rc.13"
  - "@distilled.cloud/axiom@1.0.0-rc.13"
  - "@distilled.cloud/cloudflare@1.0.0-rc.13"
  - "@distilled.cloud/core@1.0.0-rc.13"
  - "@distilled.cloud/doppler@1.0.0-rc.13"
  - "@distilled.cloud/fly-io@1.0.0-rc.13"
  - "@distilled.cloud/gcp@1.0.0-rc.13"
  - "@distilled.cloud/hetzner@1.0.0-rc.13"
  - "@distilled.cloud/infisical@1.0.0-rc.13"
  - "@distilled.cloud/neon@1.0.0-rc.13"
  - "@distilled.cloud/planetscale@1.0.0-rc.13"
  - "@distilled.cloud/prisma@1.0.0-rc.13"
  - "@distilled.cloud/railway@1.0.0-rc.13"
  - "@distilled.cloud/stripe@1.0.0-rc.13"
  - "@distilled.cloud/zerossl@1.0.0-rc.13"

# Node gives each address 250ms to connect before trying the next. Cloudflare's
# API can take longer on some networks, so every attempt times out and Alchemy
# reports its state store as missing. curl, which waits longer, still connects.
nodeOptions: --network-family-autoselection-attempt-timeout=2000

# Effect releases its packages together, and the HTTP, RPC, SQL and AI modules
# Pakshi uses can break in a minor release. Alchemy and @effect/platform-node
# depend on some Effect packages with caret ranges, so a fresh resolve could
# pair a newer one with ours. Hold every Effect package, direct or transitive,
# to the catalog's version.
overrides:
  # Alchemy's local runtime pins workerd 1.20260918, which refuses compatibility
  # dates after its build. The Vitest plugin already runs 1.20261001. Remove
  # when Alchemy pins a workerd at least as new as `workerCompatibility.date`.
  "@alchemy.run/cloudflare-runtime>workerd": 1.20261001.1
  "@effect/ai-openai-compat": "catalog:"
  "@effect/platform-node": "catalog:"
  "@effect/platform-node-shared": "catalog:"
  "@effect/sql-d1": "catalog:"
  "@effect/sql-sqlite-do": "catalog:"
  "@effect/sql-sqlite-node": "catalog:"
  "@effect/vitest": "catalog:"
  effect: "catalog:"

peerDependencyRules:
  allowedVersions:
    "capnp-es@0.0.16>typescript": "7"
    # Patched to support Vitest 5; see patchedDependencies.
    "@cloudflare/vitest-plugin@1.3.5>vitest": "5"

patchedDependencies:
  # Destroying a local stage left its Durable Objects' storage in .alchemy/local,
  # keyed by worker name and class, so redeploying the same worker brought the
  # old objects back. The local Worker provider now removes each namespace's
  # storage when the worker is deleted (src and lib). Remove when Alchemy's
  # local Worker provider does this itself.
  alchemy@2.0.0-beta.80: patches/alchemy@2.0.0-beta.80.patch
  # Vitest 5 support, ported to the published build from
  # https://github.com/cloudflare/workers-sdk/pull/15500: the runner always uses
  # workerd's new module registry and its V2 module fallback protocol, enables
  # `weak_ref` for Vitest 5's spies, and forwards coverage files to the host.
  # Remove when a release includes that pull request.
  "@cloudflare/vitest-plugin@1.3.5": patches/@cloudflare__vitest-plugin@1.3.5.patch
