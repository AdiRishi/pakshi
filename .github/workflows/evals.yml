name: Agent evals

# The evals call the real model through AI Gateway, so they run only when
# what the agent reads or does changes: its prompts, tools and model
# choices, and the block contracts and recipes it builds with.
on:
  pull_request:
    paths:
      - "packages/agent/**"
      - "packages/blocks/src/**"
      - "packages/contracts/src/agent.ts"
      - "packages/contracts/src/ops.ts"
  push:
    branches: [main]
    paths:
      - "packages/agent/**"
      - "packages/blocks/src/**"
      - "packages/contracts/src/agent.ts"
      - "packages/contracts/src/ops.ts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evals:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      AI_GATEWAY_ID: ${{ vars.AI_GATEWAY_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_EVALS_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @repo/agent evals
