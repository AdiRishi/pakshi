name: Agent evals

# The evals call the real model through AI Gateway and cost money on every
# run, so they run only when someone starts them from the Actions tab, such
# as after changing the agent's prompts, tools or models.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evals:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      AI_GATEWAY_ID: ${{ vars.AI_GATEWAY_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_EVALS_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @repo/agent evals
