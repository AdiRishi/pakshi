name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm typecheck
      - run: pnpm --filter @repo/studio exec playwright install --with-deps chromium
      - run: pnpm test:unit
      - run: pnpm build

  production-plan:
    # Deleting a D1 database, an R2 bucket or a Durable Object class destroys
    # production data, so no change that would do it may merge.
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.PRODUCTION_CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.PRODUCTION_CLOUDFLARE_ACCOUNT_ID }}
      ORGANIZATION_NAME: ${{ vars.ORGANIZATION_NAME }}
      OIDC_DISCOVERY_URL: ${{ vars.OIDC_DISCOVERY_URL }}
      OIDC_CLIENT_ID: ${{ vars.OIDC_CLIENT_ID }}
      OIDC_CLIENT_SECRET: ${{ secrets.OIDC_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - name: Check the production plan
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::PRODUCTION_CLOUDFLARE_API_TOKEN is not set, so the production plan was not checked."
            exit 0
          fi
          pnpm plan:check
